<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Downhill Training</title>
<style>
:root {
  --bg: #0F0F0F;
  --bg2: #1A1A1A;
  --bg3: #242424;
  --border: #2E2E2E;
  --text: #F0EDE8;
  --text2: #A8A39C;
  --text3: #666;
  --accent: #E8501A;
  --accent2: #C43D10;
  --green: #2ECC71;
  --yellow: #F4B942;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; min-height: 100vh; padding-bottom: 72px; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border); display: flex; z-index: 100; }
.nav-btn { flex: 1; padding: 10px 4px 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text3); font-size: 10px; cursor: pointer; transition: color .15s; }
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }

/* PAGES */
.page { display: none; padding: 16px; }
.page.active { display: block; }

/* HEADER */
.page-header { margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.page-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }

/* TODAY */
.session-type-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; margin-bottom: 16px; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.progress-bar { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.progress-label { font-size: 12px; color: var(--text2); white-space: nowrap; }

/* BLOCKS */
.block { background: var(--bg2); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.block-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.block-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.block-done-badge { font-size: 11px; color: var(--green); font-weight: 600; }
.ex-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
.ex-item:last-child { border-bottom: none; }
.ex-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; margin-top: 1px; }
.ex-check.checked { background: var(--accent); border-color: var(--accent); }
.ex-check.checked::after { content: ''; display: block; width: 5px; height: 9px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px,-1px); }
.ex-content { flex: 1; min-width: 0; }
.ex-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.ex-name.done { color: var(--text3); text-decoration: line-through; }
.ex-detail { font-size: 12px; color: var(--text2); line-height: 1.5; margin-bottom: 2px; }
.ex-kit { font-size: 11px; color: var(--text3); }

/* FLOATING BUTTONS */
.float-btns { display: flex; gap: 8px; margin-bottom: 16px; }
.float-btn { flex: 1; padding: 11px; border: 1.5px dashed var(--border); background: none; color: var(--text2); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.float-btn:active { border-color: var(--accent); color: var(--accent); }

/* LOG FORM */
.log-form { background: var(--bg2); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
.log-form-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 12px; }
.note-area { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 10px 12px; resize: none; height: 72px; font-family: inherit; margin-bottom: 12px; }
.feeling-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 12px; }
.feel-btn { padding: 9px 4px; border: 1.5px solid var(--border); background: var(--bg3); color: var(--text2); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
.feel-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,80,26,.1); }
.complete-btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; }
.complete-btn:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; }

/* LOG TAB */
.stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border-radius: var(--radius); padding: 14px; }
.stat-num { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
.log-entry { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.le-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.le-num { font-size: 12px; font-weight: 700; color: var(--accent); }
.le-date { font-size: 12px; color: var(--text3); }
.le-content { font-size: 13px; color: var(--text2); margin-bottom: 6px; line-height: 1.4; }
.le-feeling { font-size: 12px; font-weight: 600; }
.le-note { font-size: 12px; color: var(--text3); margin-top: 4px; font-style: italic; }
.feeling-tough { color: #E24B4A; }
.feeling-hard { color: var(--yellow); }
.feeling-good { color: var(--green); }
.feeling-great { color: #5BC4F5; }

/* GLOSSARY */
.glossary-search { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; padding: 10px 14px; font-family: inherit; margin-bottom: 16px; }
.gterm { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }
.gterm-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.gterm-def { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 8px; }
.gterm-link { font-size: 12px; color: var(--accent); text-decoration: none; }

/* SETTINGS */
.settings-card { background: var(--bg2); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.settings-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.settings-val { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
.settings-btn { width: 100%; padding: 11px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; }
.settings-btn.danger { color: #E24B4A; border-color: #E24B4A; }

/* SYNC */
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); display: inline-block; margin-right: 5px; }
.sync-dot.synced { background: var(--green); }
.sync-dot.syncing { background: var(--yellow); }
.sync-dot.error { background: #E24B4A; }
.sync-bar { position: fixed; top: 0; left: 0; right: 0; padding: 6px 16px; font-size: 12px; color: var(--text2); background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; z-index: 99; }
.page { padding-top: 36px; }

/* EMPTY STATE */
.empty { text-align: center; padding: 48px 24px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<div class="sync-bar" id="sync-bar">
  <span class="sync-dot" id="sync-dot"></span>
  <span id="sync-text">Connecting…</span>
</div>

<!-- TODAY -->
<div class="page active" id="page-today">
  <div id="today-content"></div>
</div>

<!-- LOG -->
<div class="page" id="page-log">
  <div class="page-header">
    <div class="page-title">My Log</div>
    <div class="page-sub">Every actual session, what you did and how it felt</div>
  </div>
  <div id="log-stats"></div>
  <div id="log-entries"></div>
</div>

<!-- GLOSSARY -->
<div class="page" id="page-glossary">
  <div class="page-header">
    <div class="page-title">Glossary</div>
  </div>
  <input class="glossary-search" id="glossary-search" placeholder="Search exercises…" oninput="filterGlossary(this.value)">
  <div id="glossary-content"></div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="page-header">
    <div class="page-title">Settings</div>
  </div>
  <div id="settings-content"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="tab-today" onclick="showPage('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Today
  </button>
  <button class="nav-btn" id="tab-log" onclick="showPage('log')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Log
  </button>
  <button class="nav-btn" id="tab-glossary" onclick="showPage('glossary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Glossary
  </button>
  <button class="nav-btn" id="tab-settings" onclick="showPage('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </button>
</nav>

<script>
// ── CONSTANTS ──────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-fhsW1RAXWP16IpIJ_U8tLmVPX-AZaBFv2zM1pbI5v8GTM_O9YonjbnphxKUaG9mI/exec';

const WARMUP_BLOCK = {
  id: 'warmup',
  label: 'Warm-up · 10 min',
  exercises: [
    {name:'Deep belly breathing', detail:'2×10 breaths. Lie on back, legs elevated. Inhale 4 counts, hold 2, exhale 4.'},
    {name:'Side-to-side knee rolls', detail:'2×10 each side. Lie on back, arms wide, knees bent. Lower both knees slowly each side.'},
    {name:'Cat camel', detail:'2×10. On hands and knees. Round spine up (cat) 2 sec, arch spine (camel) 2 sec.'},
    {name:'Lying twist stretch', detail:'1×30 sec each side. Pull one knee across body, keep opposite shoulder down. Breathe into it.'},
  ]
};

const FINISH_BLOCK = {
  id: 'finish',
  label: 'Finish · 5 min',
  exercises: [
    {name:'Hip flexor + quad stretch', detail:'45 sec each side. Kneeling, tuck tailbone, shift hips forward.'},
    {name:'Lying twist stretch', detail:'30 sec each side. End every session with this.'},
    {name:'Quad stretch', detail:'45 sec each side. Stand on one leg, hold foot behind you.'},
  ]
};

const SESSION_A = {
  type: 'A',
  label: 'Session A — Lower body + posterior chain',
  blocks: [
    {id:'a_legs', label:'Legs · compound', exercises:[
      {name:'Bulgarian split squat', detail:'3×8 each. Rear foot on sofa. 3-sec lower, explosive up. Add 8kg DBs when bodyweight feels easy.', kit:'Sofa, DBs optional'},
      {name:'DB Romanian deadlift', detail:'3×8. DBs in front of thighs. Hinge at hips, back flat, lower DBs to shins, drive hips forward. Light weight if back uncertain.', kit:'8–10kg dumbbells'},
      {name:'Reverse lunge', detail:'2×8 each. Step back, lower rear knee. Front shin stays vertical. Bodyweight or DBs at sides.', kit:'DBs optional'},
    ]},
    {id:'a_single', label:'Single leg + knee', exercises:[
      {name:'Single-leg glute bridge', detail:'2×8 each. One leg straight, drive through planted heel, hold 2 sec at top.', kit:'Yoga mat'},
      {name:'TKE', detail:'2×12 each. Band behind knee, face anchor. Slight forward lean. Straighten fully — feel inner kneecap not glute.', kit:'Tube band'},
      {name:'Lateral band walk', detail:'2×10 each direction. Mini band above knees. Slight squat, maintain tension.', kit:'Mini loop band'},
    ]},
    {id:'a_balance', label:'Balance + tuck', exercises:[
      {name:'Balance board', detail:'2×60 sec. Riding stance. Eyes open then soft-focus. Progress to eyes closed.', kit:'Balance board + 30" deck'},
      {name:'Tuck hold', detail:'2×20 sec. Speedboard stance. Back flat, core braced, weight even. Rest 90 sec between.'},
    ]},
  ]
};

const SESSION_B = {
  type: 'B',
  label: 'Session B — Upper body + core',
  blocks: [
    {id:'b_push', label:'Push + pull', exercises:[
      {name:'DB shoulder press — standing', detail:'3×8. Core braced. Press overhead, slow lower.', kit:'10kg dumbbells'},
      {name:'Single-arm dumbbell row', detail:'3×10 each. Flat back, drive elbow to hip. 2-sec lower.', kit:'12–14kg dumbbells'},
      {name:'Push-up with rotation', detail:'2×8. At top, rotate one arm to ceiling. Core braced — hips do not drop.', kit:'Yoga mat'},
    ]},
    {id:'b_arms_core', label:'Arms + core', exercises:[
      {name:'Lateral raise', detail:'2×10. Arms to shoulder height, slow lower. No shrugging.', kit:'6–8kg dumbbells'},
      {name:'DB bicep curl', detail:'2×10. Elbows pinned at sides, slow lower.', kit:'10kg dumbbells'},
      {name:'Pallof press', detail:'2×10 each. Band at chest height, press out 2 sec, return. Resist rotation.', kit:'Tube band'},
      {name:'Dead bug — straight leg', detail:'2×8 each. Lower opposite arm + straight leg. Back stays flat throughout.', kit:'Yoga mat'},
    ]},
    {id:'b_tower', label:'Power tower', exercises:[
      {name:'Assisted pull-up', detail:'2×max reps. Purple or black long loop band over bar, kneel in loop. Pull eyes to bar. 3-sec lower. Record reps.', kit:'Long loop band'},
      {name:"Captain's chair knee raise", detail:'2×10. Arms on padded rests. Drive knees to hip height, hold 1 sec, lower slowly. No swinging.'},
      {name:'Woodchop — high to low', detail:'2×8 each. Band high on tower. Pull diagonally to opposite hip. Hips rotate, arms stay straight.', kit:'Tube band'},
    ]},
  ]
};

// ── STATE ──────────────────────────────────────────────────
let state = {
  // Actual sessions array: each = {id, date, feeling, note, blocks:[], programmeProgress:{A:n, B:n}}
  sessions: [],
  // Current in-progress actual session (not yet saved with feeling)
  current: null,
  // Programme progress — how many complete A and B programme sessions done
  prog: {A: 0, B: 0},
  // Next programme session type
  nextType: 'A',
};

// current = {
//   date: 'YYYY-MM-DD',
//   blocks: [{blockId, blockLabel, exercises:[{name,detail,kit,ticked}]}],
//   ticked: {blockIdx_exIdx: true},
//   note: '',
//   feeling: null,
// }

// ── LOCAL STORAGE ──────────────────────────────────────────
function saveLocal(){
  localStorage.setItem('dht_state_v2', JSON.stringify(state));
}

function loadLocal(){
  const raw = localStorage.getItem('dht_state_v2');
  if(raw){
    try { Object.assign(state, JSON.parse(raw)); } catch(e){}
  }
}

// ── SHEET SYNC ─────────────────────────────────────────────
function gsUrl(params){
  return SCRIPT_URL + '?' + Object.entries(params).map(([k,v])=>
    encodeURIComponent(k)+'='+encodeURIComponent(v||'')
  ).join('&');
}

function setSyncStatus(status, text){
  document.getElementById('sync-dot').className = 'sync-dot ' + status;
  document.getElementById('sync-text').textContent = text;
}

async function pushSession(session){
  if(!SCRIPT_URL) return;
  setSyncStatus('syncing','Saving…');
  try {
    const params = {
      action: 'saveSession',
      sessionId: session.id,
      date: session.date,
      feeling: session.feeling || '',
      note: session.note || '',
      progA: state.prog.A,
      progB: state.prog.B,
      blocks: JSON.stringify(session.blocks.map(b=>({
        blockId: b.blockId,
        blockLabel: b.blockLabel,
        ticked: b.exercises.filter(e=>e.ticked).map(e=>e.name)
      })))
    };
    await fetch(gsUrl(params));
    setSyncStatus('synced','Saved');
  } catch(e){
    setSyncStatus('error','Save failed — stored locally');
  }
}

async function fetchSessions(){
  if(!SCRIPT_URL) return;
  setSyncStatus('syncing','Syncing…');
  try {
    const r = await fetch(gsUrl({action:'getSessions'}));
    const data = await r.json();
    if(data.sessions && data.sessions.length > 0){
      // Merge: sheet is source of truth for completed sessions
      state.sessions = data.sessions;
      if(data.prog) state.prog = data.prog;
      if(data.nextType) state.nextType = data.nextType;
      saveLocal();
      renderAll();
    }
    setSyncStatus('synced','Synced');
  } catch(e){
    setSyncStatus('error','Offline — using local data');
  }
}

// ── HELPERS ────────────────────────────────────────────────
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(ds){
  return new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

function feelingLabel(f){ return ['','Tough','Hard','Good','Great'][f] || ''; }
function feelingClass(f){ return ['','feeling-tough','feeling-hard','feeling-good','feeling-great'][f] || ''; }

function getNextProgrammeSession(){
  // Returns the programme session template to show next
  return state.nextType === 'A' ? SESSION_A : SESSION_B;
}

function getCurrentBlocksFromProg(progSession){
  // Build flat block list from programme session
  return progSession.blocks.map(b=>({
    blockId: b.id,
    blockLabel: b.label,
    exercises: b.exercises.map(e=>({...e, ticked:false}))
  }));
}

// ── TODAY: CURRENT SESSION MANAGEMENT ─────────────────────
function startNewActualSession(){
  const prog = getNextProgrammeSession();
  const progBlocks = getCurrentBlocksFromProg(prog);
  state.current = {
    date: todayStr(),
    progType: state.nextType,
    blocks: progBlocks,
    note: '',
    feeling: null,
  };
  saveLocal();
  renderToday();
}

function insertWarmup(){
  if(!state.current) return;
  const wb = {
    blockId: 'warmup_' + Date.now(),
    blockLabel: WARMUP_BLOCK.label,
    exercises: WARMUP_BLOCK.exercises.map(e=>({...e, ticked:false})),
    isInserted: true
  };
  state.current.blocks.unshift(wb);
  saveLocal();
  renderToday();
}

function insertFinish(){
  if(!state.current) return;
  const fb = {
    blockId: 'finish_' + Date.now(),
    blockLabel: FINISH_BLOCK.label,
    exercises: FINISH_BLOCK.exercises.map(e=>({...e, ticked:false})),
    isInserted: true
  };
  state.current.blocks.push(fb);
  saveLocal();
  renderToday();
}

function tickExercise(blockIdx, exIdx){
  if(!state.current) return;
  const ex = state.current.blocks[blockIdx].exercises[exIdx];
  ex.ticked = !ex.ticked;
  saveLocal();
  renderToday();
}

function setFeeling(f){
  if(!state.current) return;
  state.current.feeling = f;
  saveLocal();
  renderToday();
}

function setNote(val){
  if(!state.current) return;
  state.current.note = val;
  saveLocal();
}

async function completeActualSession(){
  if(!state.current || !state.current.feeling) return;

  // Count ticked exercises from programme blocks (not inserted warmup/finish)
  const progBlocks = state.current.blocks.filter(b=>!b.isInserted);
  const totalProgEx = progBlocks.reduce((n,b)=>n+b.exercises.length,0);
  const tickedProgEx = progBlocks.reduce((n,b)=>n+b.exercises.filter(e=>e.ticked).length,0);
  const pct = totalProgEx > 0 ? Math.round(tickedProgEx/totalProgEx*100) : 0;

  // Build saved session
  const session = {
    id: 'actual_' + Date.now(),
    date: state.current.date,
    feeling: state.current.feeling,
    note: state.current.note,
    progType: state.current.progType,
    pct: pct,
    blocks: state.current.blocks,
  };

  // If 100% of programme exercises ticked, advance programme
  if(pct === 100){
    state.prog[state.current.progType]++;
    state.nextType = state.nextType === 'A' ? 'B' : 'A';
  }
  // If partial, keep nextType same so next session continues same programme session

  state.sessions.push(session);
  state.current = null;
  saveLocal();
  await pushSession(session);
  renderAll();
}

// ── RENDER TODAY ───────────────────────────────────────────
function renderToday(){
  const el = document.getElementById('today-content');
  const today = todayStr();

  // If no current session, show start screen
  if(!state.current){
    const next = getNextProgrammeSession();
    const totalDone = state.sessions.length;
    const lastSession = state.sessions[state.sessions.length-1];
    const lastDate = lastSession ? formatDate(lastSession.date) : null;
    const lastPct = lastSession ? lastSession.pct : null;

    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">Today</div>
        <div class="page-sub">${formatDate(today)}</div>
      </div>
      ${totalDone > 0 ? `
        <div style="background:var(--bg2);border-radius:var(--radius);padding:14px;margin-bottom:16px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">LAST SESSION</div>
          <div style="font-size:13px;color:var(--text2)">${lastDate} · Session ${lastSession.progType} · ${lastPct}% complete</div>
        </div>` : ''}
      <div style="background:var(--bg2);border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center">
        <div style="font-size:11px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Next up</div>
        <div class="session-type-badge" style="display:inline-flex;margin-bottom:12px">${next.type}</div>
        <div style="font-size:14px;font-weight:600;margin-bottom:4px">${next.label}</div>
        <div style="font-size:12px;color:var(--text2)">A${state.prog.A} completed · B${state.prog.B} completed</div>
      </div>
      <button onclick="startNewActualSession()" style="width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer">Start session</button>
    `;
    return;
  }

  // Active session
  const totalEx = state.current.blocks.reduce((n,b)=>n+b.exercises.length,0);
  const tickedEx = state.current.blocks.reduce((n,b)=>n+b.exercises.filter(e=>e.ticked).length,0);
  const pct = totalEx > 0 ? Math.round(tickedEx/totalEx*100) : 0;
  const progType = state.current.progType;

  const blocksHTML = state.current.blocks.map((b,bi)=>{
    const blockDone = b.exercises.length > 0 && b.exercises.every(e=>e.ticked);
    const exHTML = b.exercises.map((e,ei)=>`
      <div class="ex-item">
        <div class="ex-check ${e.ticked?'checked':''}" onclick="tickExercise(${bi},${ei})"></div>
        <div class="ex-content">
          <div class="ex-name ${e.ticked?'done':''}">${e.name}</div>
          ${e.detail?`<div class="ex-detail">${e.detail}</div>`:''}
          ${e.kit?`<div class="ex-kit">🎒 ${e.kit}</div>`:''}
        </div>
      </div>`).join('');
    return `
      <div class="block">
        <div class="block-header">
          <div class="block-label">${b.blockLabel}</div>
          ${blockDone?'<div class="block-done-badge">✓ Done</div>':''}
        </div>
        ${exHTML}
      </div>`;
  }).join('');

  const feeling = state.current.feeling;

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div>
        <div class="session-type-badge">Session ${progType}</div>
      </div>
      <div style="font-size:12px;color:var(--text3)">${formatDate(state.current.date)}</div>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${tickedEx}/${totalEx}</div>
    </div>
    <div class="float-btns">
      <button class="float-btn" onclick="insertWarmup()">+ Warm-up</button>
      <button class="float-btn" onclick="insertFinish()">+ Finish</button>
    </div>
    ${blocksHTML}
    <div class="log-form">
      <div class="log-form-title">Log this session</div>
      <textarea class="note-area" placeholder="Notes — back, knee, what you skipped, anything for Claude…" onblur="setNote(this.value)">${state.current.note||''}</textarea>
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px">How did it feel?</div>
      <div class="feeling-grid">
        ${[1,2,3,4].map(f=>`<button class="feel-btn ${feeling===f?'active':''}" onclick="setFeeling(${f})">${feelingLabel(f)}</button>`).join('')}
      </div>
      <button class="complete-btn" onclick="completeActualSession()" ${!feeling?'disabled':''}>
        ${!feeling ? 'Select a feeling to complete' : 'Complete & save session'}
      </button>
    </div>
  `;
}

// ── RENDER LOG ─────────────────────────────────────────────
function renderLog(){
  const total = state.sessions.length;
  const thisWeek = (() => {
    const now = new Date();
    const weekAgo = new Date(now - 7*24*60*60*1000);
    return state.sessions.filter(s=>new Date(s.date+'T12:00:00')>=weekAgo).length;
  })();
  const thisMonth = (() => {
    const now = new Date();
    return state.sessions.filter(s=>{
      const d = new Date(s.date+'T12:00:00');
      return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    }).length;
  })();

  document.getElementById('log-stats').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total sessions</div></div>
      <div class="stat-card"><div class="stat-num">${thisWeek}</div><div class="stat-label">This week</div></div>
      <div class="stat-card"><div class="stat-num">${thisMonth}</div><div class="stat-label">This month</div></div>
      <div class="stat-card"><div class="stat-num">A${state.prog.A} B${state.prog.B}</div><div class="stat-label">Programme progress</div></div>
    </div>
  `;

  if(total === 0){
    document.getElementById('log-entries').innerHTML = '<div class="empty">No sessions logged yet.<br>Start your first session on the Today tab.</div>';
    return;
  }

  const entriesHTML = [...state.sessions].reverse().map((s,i)=>{
    const num = total - i;
    const blocksDesc = s.blocks
      .filter(b=>!b.isInserted || b.blockId.startsWith('warmup') || b.blockId.startsWith('finish'))
      .map(b=>{
        const tickedNames = b.exercises.filter(e=>e.ticked).map(e=>e.name);
        const totalN = b.exercises.length;
        if(tickedNames.length === 0) return null;
        if(tickedNames.length === totalN) return b.blockLabel;
        return `${b.blockLabel} (${tickedNames.length}/${totalN})`;
      }).filter(Boolean).join(' · ');

    return `
      <div class="log-entry">
        <div class="le-header">
          <div class="le-num">Session ${num} · ${s.progType}</div>
          <div class="le-date">${formatDate(s.date)}</div>
        </div>
        <div class="le-content">${blocksDesc || 'No exercises ticked'} · ${s.pct}% complete</div>
        <div class="le-feeling ${feelingClass(s.feeling)}">${feelingLabel(s.feeling)}</div>
        ${s.note ? `<div class="le-note">"${s.note}"</div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('log-entries').innerHTML = entriesHTML;
}

// ── GLOSSARY ───────────────────────────────────────────────
const GLOSSARY = [
  {term:'Assisted pull-up',def:'Loop your purple long loop band over the pull-up bar. Kneel in the loop. Pull up as high as you can — ceiling limits you to eyes at bar level. Lower over 3 seconds. Purple = most assistance, black = less, red = least.',url:'https://www.youtube.com/results?search_query=assisted+pull+up+resistance+band'},
  {term:'Balance board',def:'Stand on your roller balance board with your 30" street deck on top. Feet in your speedboard stance — narrow. Find the balance point. Eyes open first, then soft-focus, then closed. Trains the micro-adjustments that keep you stable at speed.',url:'https://www.youtube.com/results?search_query=balance+board+riding+stance'},
  {term:'Bulgarian split squat',def:'Rear foot elevated on sofa. Front foot well forward. Lower rear knee toward floor, drive through front heel. Keep torso upright. 3-sec lower. Bodyweight first, add DBs at sides when solid.',url:'https://www.youtube.com/results?search_query=bulgarian+split+squat+form'},
  {term:"Captain's chair knee raise",def:'On the power tower, forearms on padded rests, body hanging. Drive both knees to hip height, hold 1 sec, lower slowly. No swinging. Core focus — grip is just for support.',url:'https://www.youtube.com/results?search_query=captains+chair+knee+raise'},
  {term:'Cat camel',def:'On hands and knees. Cat: exhale, round spine up, tuck chin and tailbone, hold 2 sec. Camel: inhale, let belly drop, lift head and tailbone, hold 2 sec. Slow and continuous. Mobilises whole spine.',url:'https://www.youtube.com/results?search_query=cat+camel+exercise+back'},
  {term:'DB Romanian deadlift',def:'Stand tall, DBs in front of thighs. Push hips back, lower DBs down shins — back completely flat throughout. Feel hamstring stretch. Drive hips forward to stand. This is a hip hinge, not a squat.',url:'https://www.youtube.com/results?search_query=dumbbell+romanian+deadlift+form'},
  {term:'DB bicep curl',def:'Stand tall, DBs at sides, palms forward. Curl to shoulder height — elbows pinned at sides throughout. Lower slowly over 2–3 sec. No swinging.',url:'https://www.youtube.com/results?search_query=dumbbell+bicep+curl+form'},
  {term:'DB shoulder press — standing',def:'Stand tall, core braced. DBs at shoulder height, palms forward. Press overhead until arms extended. Lower slowly. Only use standing version when lower back is fully comfortable.',url:'https://www.youtube.com/results?search_query=standing+dumbbell+shoulder+press'},
  {term:'Dead bug — straight leg',def:'Lie on back, arms to ceiling, legs at 90°. Press lower back into floor — keep it there throughout. Lower opposite arm overhead and straighten + lower opposite leg simultaneously. Only go as far as back stays flat. Return and switch.',url:'https://www.youtube.com/results?search_query=dead+bug+straight+leg+exercise'},
  {term:'Deep belly breathing',def:'Lie on back, legs elevated on sofa. One hand on stomach, one on chest. Inhale through nose 4 counts, hold 2, exhale through mouth 4. Relaxes deep spinal muscles. Non-negotiable opener.',url:'https://www.youtube.com/results?search_query=diaphragmatic+breathing+back+relief'},
  {term:'Hip flexor + quad stretch',def:'Kneel on one knee. Tuck tailbone, shift hips gently forward — feel stretch at front of rear hip. Add quad: reach back and pull rear foot to glute. Hold 45 sec per side.',url:'https://www.youtube.com/results?search_query=kneeling+hip+flexor+quad+stretch'},
  {term:'Lateral band walk',def:'Mini band above knees. Slight knee bend. Step sideways — maintain band tension throughout. Do not let knees cave. Targets glute medius — controls knee tracking.',url:'https://www.youtube.com/results?search_query=lateral+band+walk+glute+med'},
  {term:'Lateral raise',def:'DBs at sides. Raise arms to shoulder height — slight bend in elbows fine. Hold 1 sec, lower slowly over 2–3 sec. No shrugging, no momentum.',url:'https://www.youtube.com/results?search_query=dumbbell+lateral+raise+form'},
  {term:'Lying twist stretch',def:'Lie on back, arms out to sides. Pull one knee across body with opposite hand, keep opposite shoulder on floor. Hold 30 sec. Breathe into it. Relieves lower back tension.',url:'https://www.youtube.com/results?search_query=lying+twist+stretch+lower+back'},
  {term:'Pallof press',def:'Tube band at chest height in door frame. Stand side-on. Hold band at chest, press straight out, hold 2 sec, return. Band tries to rotate you — resist entirely. Anti-rotation core.',url:'https://www.youtube.com/results?search_query=pallof+press+anti+rotation'},
  {term:'Push-up with rotation',def:'Standard push-up. At the top, rotate one arm to ceiling — body forms a T. Return, lower, rotate other side. Core braced throughout.',url:'https://www.youtube.com/results?search_query=push+up+with+rotation'},
  {term:'Quad stretch',def:'Stand on one leg, hold other foot behind you with same-side hand. Knees together, stand tall. Hold 45 sec. Use wall for balance.',url:'https://www.youtube.com/results?search_query=standing+quad+stretch'},
  {term:'Reverse lunge',def:'Step one foot back, lower rear knee toward floor. Front shin stays vertical. Push through front heel to return. More knee-friendly than forward lunge.',url:'https://www.youtube.com/results?search_query=reverse+lunge+form'},
  {term:'Side-to-side knee rolls',def:'Lie on back, arms wide, knees bent. Lower both knees slowly to one side, return, other side. Only go as far as comfortable. Relieves lower back tension.',url:'https://www.youtube.com/results?search_query=supine+knee+rolls+lower+back'},
  {term:'Single-arm dumbbell row',def:'Hinge forward, flat back, one hand on chair for support. Dumbbell hangs from working arm. Pull elbow to hip — not a curl. Lower with control.',url:'https://www.youtube.com/results?search_query=single+arm+dumbbell+row+form'},
  {term:'Single-leg glute bridge',def:'Lie on back, one leg extended straight. Drive through planted heel, squeeze glute, lift hips to straight line. Hold 2 sec at top, lower slowly.',url:'https://www.youtube.com/results?search_query=single+leg+glute+bridge'},
  {term:'TKE — Terminal Knee Extension',def:'Band anchored at knee height. Face the anchor. Band behind your knee — not thigh. Slight forward lean, small knee bend. Fully straighten against resistance. Feel inner kneecap — not glute. If you feel it in glute: face anchor, band behind knee, lean forward more.',url:'https://www.youtube.com/results?search_query=terminal+knee+extension+tke+vmo'},
  {term:'Tuck hold',def:'Speedboard tuck — knees bent, back flat and parallel to ground, arms tucked. Hold for prescribed time. Back flat not rounded, weight even, core braced.',url:'https://www.youtube.com/results?search_query=downhill+skateboard+tuck+position'},
  {term:'VMO (Vastus Medialis Oblique)',def:'Inner quad teardrop muscle above and inside the kneecap. Fires in the last 30° of knee straightening. When weak, kneecap pulls laterally causing anterior knee pain on your left side. TKE directly targets this.',url:'https://www.youtube.com/results?search_query=vmo+strengthening+knee'},
  {term:'Woodchop — high to low',def:'Band at head height on power tower. Stand side-on. Pull diagonally to opposite hip. Power from rotating hips and torso together — pivot back foot. Arms stay relatively straight.',url:'https://www.youtube.com/results?search_query=band+woodchop+high+to+low'},
];

function renderGlossary(){
  filterGlossary('');
}

function filterGlossary(query){
  const q = query.toLowerCase();
  const filtered = q ? GLOSSARY.filter(g=>g.term.toLowerCase().includes(q)||g.def.toLowerCase().includes(q)) : GLOSSARY;
  document.getElementById('glossary-content').innerHTML = filtered.map(g=>`
    <div class="gterm">
      <div class="gterm-name">${g.term}</div>
      <div class="gterm-def">${g.def}</div>
      ${g.url?`<a class="gterm-link" href="${g.url}" target="_blank">▶ Search video</a>`:''}
    </div>`).join('');
}

// ── SETTINGS ───────────────────────────────────────────────
function renderSettings(){
  document.getElementById('settings-content').innerHTML = `
    <div class="settings-card">
      <div class="settings-label">Sync</div>
      <div class="settings-val">Google Sheets via Apps Script. All sessions sync across devices.</div>
      <button class="settings-btn" onclick="fetchSessions()">Sync now</button>
    </div>
    <div class="settings-card">
      <div class="settings-label">Programme progress</div>
      <div class="settings-val">Session A completed: ${state.prog.A}<br>Session B completed: ${state.prog.B}<br>Next session: ${state.nextType}</div>
    </div>
    <div class="settings-card">
      <div class="settings-label">Data</div>
      <div class="settings-val">${state.sessions.length} actual sessions logged.</div>
      <button class="settings-btn danger" onclick="clearData()">Clear all local data</button>
    </div>
  `;
}

function clearData(){
  if(!confirm('Clear all local data? Sheet data is unaffected.')) return;
  localStorage.removeItem('dht_state_v2');
  state = {sessions:[], current:null, prog:{A:0,B:0}, nextType:'A'};
  renderAll();
}

// ── NAVIGATION ─────────────────────────────────────────────
const pageScrollPos = {};
function showPage(name){
  const current = document.querySelector('.page.active');
  if(current) pageScrollPos[current.id] = window.scrollY;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  window.scrollTo(0, pageScrollPos['page-'+name]||0);
}

// ── RENDER ALL ─────────────────────────────────────────────
function renderAll(){
  renderToday();
  renderLog();
  renderGlossary();
  renderSettings();
}

// ── INIT ───────────────────────────────────────────────────
loadLocal();
renderAll();
fetchSessions();
</script>
